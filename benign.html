<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General Gynae Clinic</title>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --ink:#1f2933; --muted:#64748b; --line:#e2e8f0;
  --accent:#0f766e; --accent-soft:#ccfbf1; --chip:#f1f5f9; --chip-ink:#334155;
  --warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--accent)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header a{font-size:13px;text-decoration:none}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:16px;max-width:1280px;margin:0 auto;padding:16px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.divider{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border-bottom:2px solid var(--accent-soft);padding-bottom:4px;margin:26px 0 14px}
.divider:first-child{margin-top:0}
.sec{margin-bottom:16px}
.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.sublbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;user-select:none;font-family:inherit}
.chip:hover{border-color:#94a3b8}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.chosen{background:#134e4a;border-color:#134e4a;color:#fff;font-weight:600}
.chip.chosen::before{content:"\2713  "}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}
.key span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.key .k1::before{background:var(--accent)} .key .k2::before{background:#134e4a}
.req{color:#b91c1c}
.sub{margin:8px 0 4px 12px;padding-left:12px;border-left:3px solid var(--accent-soft)}
input[type=text],input[type=date],textarea{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);width:100%;max-width:520px}
textarea{min-height:64px;resize:vertical;max-width:none}
input.small{width:90px}
.free{margin-top:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.stepper button{border:0;background:var(--chip);width:32px;height:30px;font-size:17px;cursor:pointer}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.par{display:grid;grid-template-columns:150px auto;gap:8px 12px;align-items:center}
.hint{font-size:12px;color:var(--muted)}
.out{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
@media (max-width:900px){.out{position:static;max-height:none}}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.clear{display:block;width:100%;margin-top:28px;background:#fff;color:var(--warn);border-color:var(--warn)}
#report{font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#000}
#report table{border-collapse:collapse;width:100%}
#report td{vertical-align:top;padding:2px 6px 2px 0}
#report td.k{font-weight:bold;white-space:nowrap;width:1%;padding-right:12px}
#report .h{font-weight:bold;text-decoration:underline;margin:12px 0 4px}
#report .t{font-weight:bold;font-size:14px;margin-bottom:4px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
footer{max-width:1280px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--muted)}
</style>

function freshState(){
  return {
    age:"",bmi:"",ps:"",pc:[],pcFree:"",hpc:"",
    lmpDate:"",lmpStatus:"",cyclePattern:"",cycleLen:"",cycleRange:"",bleedDays:"",heaviness:"",padChange:"",mensFeatures:[],menarche:"",mensFree:"",

let S = freshState();

/* ---------- tiny DOM helpers ---------- */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k==="class") el.className=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v);
  }
  for (const c of kids.flat()){ if (c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(c)); }
  return el;
}
const chipRefreshers = [];
const conditionals = [];
const inputs = [];

/* get/set by path like "hrtDose.Oestrogel" */
function getP(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k], S); }
function setP(p,v){ const ks=p.split("."); let o=S; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null)o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=v; }

/* chip group: multi=array state; single=string state (tap again to clear) */
function chips(path, opts, {multi=false, excl=[], onChange}={}){
  const box = h("div",{class:"chips"});
  for (const o of opts){
    const b = h("button",{class:"chip",type:"button"},o);
    b.addEventListener("click",()=>{
      let cur = getP(path);
      if (multi){
        cur = Array.isArray(cur)?[...cur]:[];
        if (cur.includes(o)) cur = cur.filter(x=>x!==o);
        else if (excl.includes(o)) cur=[o];
        else { cur = cur.filter(x=>!excl.includes(x)); cur.push(o); }
      } else cur = cur===o ? "" : o;
      setP(path,cur);
      if (onChange) onChange(o);
      update();
    });
    chipRefreshers.push(()=>{ const cur=getP(path); b.classList.toggle("on", multi ? (Array.isArray(cur)&&cur.includes(o)) : cur===o); });
    box.append(b);
  }
  return box;
}
function toggleChip(path,label){
  const b = h("button",{class:"chip",type:"button"},label);
  b.addEventListener("click",()=>{ setP(path,!getP(path)); update(); });
  chipRefreshers.push(()=>b.classList.toggle("on",!!getP(path)));
  return b;
}
function text(path, placeholder, cls){
  const el = h("input",{type:"text",placeholder:placeholder||"",class:(cls||"")});
  el.addEventListener("input",()=>{ setP(path,el.value); renderReport(); });
  inputs.push(()=>{ const v=getP(path)||""; if (el.value!==v) el.value=v; });
  return el;
}
function area(path, placeholder){
  const el = h("textarea",{placeholder:placeholder||""});
  el.addEventListener("input",()=>{ setP(path,el.value); renderReport(); });
  inputs.push(()=>{ const v=getP(path)||""; if (el.value!==v) el.value=v; });
  return el;
}
function stepper(path){
  const n = h("span",null,"0");
  const el = h("span",{class:"stepper"},
    h("button",{type:"button",onclick:()=>{ setP(path,Math.max(0,(getP(path)||0)-1)); update(); }},"−"),
    n,
    h("button",{type:"button",onclick:()=>{ setP(path,(getP(path)||0)+1); update(); }},"+"));
  chipRefreshers.push(()=>{ n.textContent=getP(path)||0; });
  return el;
}
function when(fn, ...kids){
  const el = h("div",{class:"sub"},...kids);
  conditionals.push(()=>{ el.style.display = fn()?"":"none"; });
  return el;
}
function sec(label, ...kids){ return h("div",{class:"sec"}, h("div",{class:"lbl"},label), ...kids); }
function divider(t){ return h("div",{class:"divider"},t); }
function free(el){ el.classList.add("free"); return el; }

/* discussed (1 tap) -> chosen (2nd tap) -> off (3rd tap) */
function triChips(dx, gname, opts){
  const box = h("div",{class:"chips"});
  const disc = ()=>((S.dxOpt[dx]=S.dxOpt[dx]||{})[gname]=S.dxOpt[dx][gname]||[]);
  const cho  = ()=>((S.dxChosen[dx]=S.dxChosen[dx]||{})[gname]=S.dxChosen[dx][gname]||[]);
  for (const o of opts){
    const b = h("button",{class:"chip",type:"button"},o);
    b.addEventListener("click",()=>{
      const d=disc(), c=cho();
      if (c.includes(o)){ c.splice(c.indexOf(o),1); d.splice(d.indexOf(o),1); }
      else if (d.includes(o)) c.push(o);
      else d.push(o);
      update();
    });
    chipRefreshers.push(()=>{ const d=((S.dxOpt[dx]||{})[gname])||[], c=((S.dxChosen[dx]||{})[gname])||[];
      b.classList.toggle("on", d.includes(o)&&!c.includes(o)); b.classList.toggle("chosen", c.includes(o)); });
    box.append(b);
  }
  return box;
}
/* what the plan implies for follow-up: surgery and/or onward referral */
const NOT_SURGERY = ["MRI pelvis","Uterine artery embolisation","Referral to BSGE endometriosis centre","Referral to fertility"];
const IS_REFERRAL = ["Referral to BSGE endometriosis centre","Referral to fertility","GP to refer on to fertility unit if appropriate"];
function chosenAll(){ const out=[]; for (const dx of S.dx){ const c=S.dxChosen[dx]||{}; for (const gn of Object.keys(c)) for (const o of c[gn]) out.push([gn,o]); } return out; }
function surgeryList(){
  const a=[...(S.plan.Procedure||[])];
  for (const [gn,o] of chosenAll()) if (gn==="Surgical" && !NOT_SURGERY.includes(o) && !a.includes(o)) a.push(o);
  return a;
}
function referralList(){
  const a=[...(S.plan.Referral||[])];
  for (const [gn,o] of chosenAll()) if (IS_REFERRAL.includes(o) && !a.includes(o)) a.push(o);
  return a;
}
function fuSig(){ return referralList().join("|")+"#"+surgeryList().join("|"); }
function autoFu(){
  if (S.fu && !S.fuAuto) return;            // a follow-up you chose yourself is never overwritten
  if (!S.fu && S.fuSuppress){ if (S.fuSuppress===fuSig()) return; S.fuSuppress=""; }  // you cleared it: stay cleared until the plan changes
  const target = referralList().length ? "Onward referral" : surgeryList().length ? "Referred for surgery" : "";
  S.fu = target; S.fuAuto = !!target;
}

/* ---------- helpers for report ---------- */
function isoToday(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ukDate(iso){ const [y,m,d]=iso.split("-"); return d+"/"+m+"/"+y; }
function daysSince(iso){ const [y,m,d]=iso.split("-").map(Number); const a=new Date(y,m-1,d); const t=new Date(); const b=new Date(t.getFullYear(),t.getMonth(),t.getDate()); return Math.round((b-a)/86400000); }
function joinList(a){ return a.filter(Boolean).join(", "); }
function withFree(arr, fr){ return joinList([...(arr||[]), (fr||"").trim()]); }
function lc(s){ return s.charAt(0).toLowerCase()+s.slice(1); }
function plural(n,s,p){ return n+" "+(n===1?s:(p||s+"s")); }

function buildReport(){
  const secs = []; // {title, rows:[[k,v]]}
  const add = (title, rows)=>{ rows = rows.filter(r=>r && r[1]); if (rows.length) secs.push({title, rows}); };

  /* demographics line */
  const demo = [];
  if (S.age.trim()) demo.push(S.age.trim()+" y.o");
  if (S.bmi.trim()) demo.push("BMI "+S.bmi.trim());
  if (S.ps) demo.push("Performance score "+S.ps);

  /* history */
  const hist = [];
  hist.push(["PC", withFree(S.pc, S.pcFree)]);
  hist.push(["HPC", S.hpc.trim()]);

  /* periods */
  const lmp = S.lmpDate ? (()=>{ const n=daysSince(S.lmpDate); return ukDate(S.lmpDate)+(n>=0?" (day "+(n+1)+")":""); })() : S.lmpStatus;
  let cyc = "";
  const len = S.cycleRange.trim() ? S.cycleRange.trim()+" days" : (S.cycleLen ? S.cycleLen+" days" : "");
  if (S.cyclePattern || len) cyc = joinList([S.cyclePattern, len]);
  let bleed = "";
  const bp = [];
  if (S.bleedDays) bp.push(S.bleedDays+" days");
  if (S.heaviness) bp.push(lc(S.heaviness));
  if (S.padChange) bp.push(lc(S.padChange)+" changes");
  bleed = bp.join(", ");
  const mensRows = [
    ["LMP", lmp],
    ["Cycle", cyc],
    ["Bleeding", bleed],
    ["Associated", joinList(S.mensFeatures)],
    ["Menarche", S.menarche.trim() ? "age "+S.menarche.trim() : ""],
    ["Periods – other", S.mensFree.trim()],
  ];

  /* hormones */
  const horm = [];
  if (S.hormones.includes("Nil hormones")) horm.push(["Hormones","Nil"]);
  if (S.hormones.includes("HRT")){
    const items = S.hrt.map(n=>{ const d=S.hrtDose[n]; if(!d) return n; if(n==="Vaginal oestrogen"||n==="Testosterone") return n+" ("+d+")"; return n+" "+d; });
    horm.push(["HRT", withFree(items, S.hrtFree) || "Yes"]);
  }
  if (S.hormones.includes("Contraception")){
    const items = S.contra.map(n=>{
      if (n==="COCP"){ const x=joinList([S.cocpPill, S.cocpRegimen && lc(S.cocpRegimen)+" regimen"]); return x?"COCP ("+x+")":"COCP"; }
      if (n==="POP") return S.popPill ? "POP ("+S.popPill+")" : "POP";
      const yr = (S.devInserted[n]||"").trim();
      return yr ? n+" (inserted "+yr+")" : n;
    });
    horm.push(["Contraception", withFree(items, S.contraFree) || "Yes"]);
  }

  /* parity */
  const g = S.svd+S.cs+S.misc+S.top+S.ect, p = S.svd+S.cs;
  let parity = "";
  if (g>0){
    const bits = [];
    if (S.svd) bits.push(plural(S.svd,"vaginal birth"));
    if (S.cs) bits.push(plural(S.cs,"caesarean section"));
    if (S.misc) bits.push(plural(S.misc,"miscarriage")+(S.miscMgmt.length?" ("+S.miscMgmt.join(", ")+")":""));
    if (S.top) bits.push(plural(S.top,"termination")+(S.topTypes.length?" ("+S.topTypes.join(", ")+")":""));
    if (S.ect){
      const side = S.ectSide.length===2 ? "bilateral" : S.ectSide.length ? lc(S.ectSide[0]) : "";
      const det = joinList([side, ...S.ectMgmt.map(lc)]);
      bits.push(plural(S.ect,"ectopic pregnancy","ectopic pregnancies")+(det?" ("+det+")":""));
    }
    parity = "G"+g+" P"+p+" ("+bits.join(", ")+")";
  }
  if (S.parityExtra.trim()) parity = joinList([parity, S.parityExtra.trim()]);

  /* surgery */
  const surg = S.psurg.map(n=>{ const a=S.psurgApp[n]; return a ? lc(a)+" "+lc(n) : n; }).map(s=>s.charAt(0).toUpperCase()+s.slice(1));
  const sh = joinList([S.smoke, S.livesAlone?"Lives alone":"", S.shFree.trim()]);

  const histRows = [
    ...hist, ...mensRows, ...horm,
    ["Parity", parity],
    ["Smears", withFree(S.smears?[S.smears]:[], S.smearsFree)],
    ["PMed", withFree(S.pmed, S.pmedFree)],
    ["Meds", withFree(S.meds, S.medsFree)],
    ["Allergies", withFree(S.allergies, S.allergiesFree)],
    ["PSurg", withFree(surg, S.psurgFree)],
    ["SH", sh],
    ["FH", withFree(S.fh, S.fhFree)],
  ];
  add("HISTORY", histRows);

  /* previous imaging */
  add("PREVIOUS IMAGING", S.prevImg.map(m=>[m==="Other"?"Other imaging":m, (S.prevImgText[m]||"").trim()]));

  /* ultrasound */
  add("ULTRASOUND", [
    ["Uterus", withFree(S.ussUt, S.ussUtFree)],
    ["ET", S.et.trim() ? S.et.trim().replace(/\s*mm$/i,"")+" mm" : ""],
    ["Ovaries", withFree(S.ussOv, S.ussOvFree)],
  ]);

  /* examination */
  const ex = [];
  const ch = S.chaperoneFree.trim() || S.chaperone;
  const chapLine = S.chapStatus==="Chaperone present" ? "Chaperone present"+(ch?" ("+ch+")":"")
                 : S.chapStatus==="Chaperone offered, declined" ? "Chaperone offered, declined" : "";
  if (S.exam==="Examined"){
    ex.push(["Consent", joinList(["Verbal consent obtained", chapLine && lc(chapLine)])]);
    ex.push(["Abdomen", withFree(S.abdo, S.abdoFree)]);
    ex.push(["Vulva/vagina", joinList(S.vulva)]);
    ex.push(["Cervix", joinList(S.cervix)]);
    const size = S.utSize==="Enlarged" && S.utSizeWeeks.trim() ? "Enlarged ("+S.utSizeWeeks.trim()+" week size)" : S.utSize;
    const ut = [size, S.utPos, S.utMob, S.utTender].filter(Boolean).map((s,i)=>i?lc(s):s).join(", ");
    ex.push(["Uterus", ut]);
    ex.push(["Adnexa", joinList(S.adnexa)]);
    ex.push(["Other", S.examFree.trim()]);
  } else {
    if (S.exam) ex.push(["Examination", S.exam]);
    if (chapLine) ex.push(["Chaperone", chapLine]);
  }
  ex.push(["Procedures", withFree(S.procToday, S.procFree)]);
  add("EXAMINATION", ex);

  /* discussion */
  add("DIAGNOSIS", [["", withFree(S.dx, S.dxFree)]]);
  const disc = [];
  for (const dx of S.dx){
    const parts = Object.keys(DX[dx]).map(gn=>{ const v=((S.dxOpt[dx]||{})[gn])||[]; return v.length ? lc(gn)+": "+v.map(x=>/^[A-Z]{2}|^Mirena|^Depo|^Yselty/.test(x)?x:lc(x)).join(", ") : ""; }).filter(Boolean);
    if (parts.length) disc.push([dx, "Options discussed — "+parts.join("; ")]);
  }
  const dl =[...S.discuss.map(x=>x+"."), S.discussFree.trim()].filter(Boolean).join(" ");
  if (dl) disc.push(["", dl]);
  add("DISCUSSION", disc);

  /* plan */
  const pl = [];
  const chosen = [];
  for (const dx of S.dx){ const c=S.dxChosen[dx]||{}; for (const gn of Object.keys(DX[dx]||{})) for (const o of (c[gn]||[])) if(!chosen.includes(o)) chosen.push(o); }
  if (chosen.length) pl.push(["Agreed", chosen.join(", ")]);
  for (const gr of PLAN_GROUPS){
    let v=S.plan[gr.k]; if (!v || !v.length) continue;
    if (gr.k==="Bloods") v = v.map(x=>x==="Hormone profile" ? HORMONE_PROFILE_TEXT.charAt(0).toUpperCase()+HORMONE_PROFILE_TEXT.slice(1)+(S.d21?", day 21 progesterone":"") : x);
    pl.push([gr.k, v.join(", ")]);
  }
  if (S.procToday.includes("Cervical smear")) pl.push(["Results","Write with smear result"]);
  else if (S.procToday.includes("Pipelle biopsy")) pl.push(["Results","Write with results"]);
  let fu = "";
  if (S.fu==="Discharge to GP") fu = "Discharge to GP";
  else if (S.fu==="PIFU") fu = "PIFU"+(S.fuMonths?" "+S.fuMonths:"");
  else if (S.fu==="Referred for surgery"){ const l=surgeryList(); fu = "Referred for surgery"+(l.length?" ("+l.map(x=>/^[A-Z]{2}/.test(x)?x:lc(x)).join(", ")+")":""); }
  else if (S.fu==="Onward referral"){ const l=referralList(); fu = "Onward referral"+(l.length?" ("+l.map(x=>/^[A-Z]{2}|^GP/.test(x)?x:lc(x)).join(", ")+")":""); }
  else if (S.fu==="Gynae clinic") fu = "Gynae clinic"+(S.fuMonths?" in "+S.fuMonths:"")+(S.fuMode?" ("+lc(S.fuMode)+")":"");
  pl.push(["Follow-up", fu]);
  pl.push(["Other", S.planFree.trim()]);
  add("PLAN", pl);

  return {title:"Gynae Clinic: "+AUTHOR, demo:demo.join(", "), secs};
}

/* ---------- render ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\n/g,"<br>"); }
function reportHTML(r){
  let out = '<div class="t" style="font-weight:bold;font-size:14px;">'+esc(r.title)+'</div>';
  if (r.demo) out += '<div>'+esc(r.demo)+'</div>';
  for (const s of r.secs){
    out += '<div class="h" style="font-weight:bold;text-decoration:underline;margin:12px 0 4px;">'+esc(s.title)+'</div>';
    out += '<table style="border-collapse:collapse;">';
    for (const [k,v] of s.rows){
      if (k) out += '<tr><td class="k" style="font-weight:bold;vertical-align:top;padding:1px 14px 1px 0;white-space:nowrap;">'+esc(k)+'</td><td style="vertical-align:top;padding:1px 0;">'+esc(v)+'</td></tr>';
      else out += '<tr><td colspan="2" style="vertical-align:top;padding:1px 0;">'+esc(v)+'</td></tr>';
    }
    out += '</table>';
  }
  return out;
}
function reportText(r){
  const lines = [r.title];
  if (r.demo) lines.push(r.demo);
  for (const s of r.secs){
    lines.push("", s.title);
    for (const [k,v] of s.rows) lines.push(k ? k+": "+v : v);
  }
  return lines.join("\n");
}
function renderReport(){ document.getElementById("report").innerHTML = reportHTML(buildReport()); }
function update(){
  autoFu();
  chipRefreshers.forEach(f=>f());
  conditionals.forEach(f=>f());
  inputs.forEach(f=>f());
  renderReport();
}
let clearArmed=null;
function clearAll(){
  const btn=document.getElementById("clearBtn");
  if (!clearArmed){
    btn.textContent="Tap again to clear everything";
    clearArmed=setTimeout(()=>{ clearArmed=null; btn.textContent="Clear entry — start next patient"; },4000);
    return;
  }
  clearTimeout(clearArmed); clearArmed=null; btn.textContent="Clear entry — start next patient";
  S = freshState(); update(); window.scrollTo({top:0,behavior:"smooth"}); toast("Cleared — ready for next patient");
}

/* ---------- copy ---------- */
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1600); }
async function copyRich(){
  const r = buildReport(); const html = reportHTML(r), txt = reportText(r);
  try{
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([txt],{type:"text/plain"})})]);
      return toast("Report copied");
    }
  }catch(e){}
  const el = document.getElementById("report"); const range=document.createRange(); range.selectNodeContents(el);
  const sel=getSelection(); sel.removeAllRanges(); sel.addRange(range);
  const ok = document.execCommand("copy"); sel.removeAllRanges();
  toast(ok?"Report copied":"Copy failed — select the report and copy manually");
}
async function copyPlain(){
  const txt = reportText(buildReport());
  try{ await navigator.clipboard.writeText(txt); return toast("Plain text copied"); }catch(e){}
  const ta=h("textarea",null); ta.value=txt; document.body.append(ta); ta.select();
  const ok=document.execCommand("copy"); ta.remove(); toast(ok?"Plain text copied":"Copy failed");
}

buildForm();
document.getElementById("copyRich").addEventListener("click",copyRich);
document.getElementById("copyPlain").addEventListener("click",copyPlain);
update();
</script>
